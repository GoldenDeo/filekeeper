services:
  filekeeper:
    build: .
    ports:
      - "${FK_HOST_PORT:-8090}:8080"
    environment:
      FK_ADDR: ":8080"
      FK_PUBLIC_BASE_URL: ${FK_PUBLIC_BASE_URL:-http://localhost:8090}
      FK_DATA_DIR: /data
      FK_MAX_UPLOAD_BYTES: ${FK_MAX_UPLOAD_BYTES:-104857600}
      FK_TOKENS: ${FK_TOKENS:?set in .env, format service:token[:scope]}
      FK_CORS_ORIGINS: ${FK_CORS_ORIGINS:-}
      FK_SIGN_SECRET: ${FK_SIGN_SECRET:?set in .env, min 32 chars}
      FK_S3_ENDPOINT: http://garage:3900
      FK_S3_REGION: garage
      FK_S3_BUCKET: ${S3_BUCKET:-blobs}
      FK_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      FK_S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - fk-data:/data
    depends_on:
      garage:
        condition: service_healthy
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # --default-bucket creates the bucket and key on first start.
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-blobs}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env, must start with GK}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # On-the-fly image transforms (resize, webp/avif, animated gif/webp).
  # Reads blobs straight from Garage over S3; keep it read-only.
  # URL format: /<signature>/<options>/plain/s3://blobs/blobs/ab/cd/<sha256>
  imgproxy:
    image: darthsim/imgproxy:v4
    ports:
      - "8081:8080"
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set in .env, hex}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set in .env, hex}
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://garage:3900
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: garage
      IMGPROXY_MAX_SRC_RESOLUTION: "50"  # megapixels; defends against pixel-flood
    depends_on:
      garage:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fk-data:
  garage-meta:
  garage-data:
